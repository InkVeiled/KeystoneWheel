name: Release addon

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADDON_NAME: KeystoneWheel
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate tag and TOC version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag must use the form v1.2.3."
            exit 1
          fi

          tag_version="${BASH_REMATCH[1]}"
          toc_version="$(awk -F': *' '/^## Version:/ { print $2; exit }' "${ADDON_NAME}.toc" | tr -d '\r')"

          if [[ -z "${toc_version}" ]]; then
            echo "::error::No Version field found in ${ADDON_NAME}.toc."
            exit 1
          fi

          if [[ "${toc_version}" != "${tag_version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match TOC version ${toc_version}."
            exit 1
          fi

          echo "RELEASE_VERSION=${tag_version}" >> "${GITHUB_ENV}"

      - name: Build and verify WowUp archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZipFile

          addon = os.environ["ADDON_NAME"]
          tag = os.environ["RELEASE_TAG"]
          source_files = [
              Path(f"{addon}.toc"),
              Path("Locale.lua"),
              Path("Core.lua"),
              Path("UI.lua"),
              Path("Media/WheelBackdrop.tga"),
              Path("CHANGELOG.md"),
              Path("README.md"),
              Path("RELEASE_CHECKLIST.md"),
              Path("LICENSE"),
          ]

          missing = [str(path) for path in source_files if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing release files: {', '.join(missing)}")

          archive = Path("dist") / f"{addon}-{tag}.zip"
          with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=9) as package:
              for source in source_files:
                  package.write(source, arcname=f"{addon}/{source.as_posix()}")

          expected_toc = f"{addon}/{addon}.toc"
          with ZipFile(archive) as package:
              names = package.namelist()
              if expected_toc not in names:
                  raise SystemExit(f"Archive does not contain {expected_toc}")
              if any(PurePosixPath(name).parts[0] != addon for name in names):
                  raise SystemExit(f"Archive contains files outside {addon}/")

          print(f"Verified {archive}: {len(source_files)} files below {addon}/")
          PY

          echo "RELEASE_ARCHIVE=dist/${ADDON_NAME}-${RELEASE_TAG}.zip" >> "${GITHUB_ENV}"

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if not match or not match.group("body").strip():
              raise SystemExit(f"No changelog entry found for {version}.")

          notes = Path("dist/release-notes.md")
          notes.write_text(match.group("body").strip() + "\n", encoding="utf-8")
          print(f"Prepared release notes for {version}.")
          PY

          echo "RELEASE_NOTES=dist/release-notes.md" >> "${GITHUB_ENV}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}"
          "${RELEASE_ARCHIVE}"
          --verify-tag
          --notes-file "${RELEASE_NOTES}"
          --title "${ADDON_NAME} ${RELEASE_TAG}"
